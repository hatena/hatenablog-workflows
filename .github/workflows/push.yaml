name: "[Reusable workflows] push to hatena blog"

on:
  workflow_call:
    inputs:
      local_root:
        default: "entries"
        type: string
      runner:
        required: false
        default: ubuntu-latest
        type: string
    secrets:
      OWNER_API_KEY:
        required: true

jobs:
  push:
    if: |
      github.event.pull_request.merged == true
      && !contains(github.event.pull_request.labels.*.name, 'skip-push')
    runs-on: ${{ inputs.runner }}
    env:
      BLOGSYNC_PASSWORD: ${{ secrets.OWNER_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: resolve working directory
        id: working-directory
        uses: hatena/hatenablog-workflows/.github/actions/resolve-working-directory@cb4a9e94aa1400beceb5d9a99c772322b7fd6fc8
      - name: setup
        uses: hatena/hatenablog-workflows/.github/actions/setup@cb4a9e94aa1400beceb5d9a99c772322b7fd6fc8 
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: ${{ inputs.local_root }}/**/*.md
          path: ${{ steps.working-directory.outputs.working_directory }}
          since_last_remote_commit: true
      - name: blogsync push
        run: |
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            draft=$(yq --front-matter=extract 'select(.Draft == true)' "$file")
            if [[ -z "$draft" ]]; then
              blogsync push "$file"
            fi
          done
        working-directory: ${{ steps.working-directory.outputs.working_directory }}
