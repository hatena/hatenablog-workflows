name: "[Reusable workflows] pull draft entry from hatenablog"

on:
  workflow_call:
    inputs:
      title:
        required: true
        type: string
      draft:
        default: true
        type: boolean
      BLOG_DOMAIN:
        required: true
        type: string
      runner:
        required: false
        default: ubuntu-latest
        type: string
    secrets:
      OWNER_API_KEY:
        required: true

jobs:
  pull-draft:
    runs-on: ${{ inputs.runner }}
    env:
      BLOGSYNC_PASSWORD: ${{ secrets.OWNER_API_KEY }}
      ENTRY_TITLE: ${{ inputs.title }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: resolve working directory
        id: working-directory
        uses: hatena/hatenablog-workflows/.github/actions/resolve-working-directory@4733a78ce725116ca961a11a79ab58ccc24a1b1c
      - name: setup
        uses: hatena/hatenablog-workflows/.github/actions/setup@4733a78ce725116ca961a11a79ab58ccc24a1b1c 
      - name: set blog domain
        id: set-domain
        run: |
          domain=${{ inputs.BLOG_DOMAIN }}
          echo "BLOG_DOMAIN=$(echo $domain | tr -d '\n\r ')" >> "$GITHUB_OUTPUT"
      - name: pull
        run: |
          blogsync pull ${{ steps.set-domain.outputs.BLOG_DOMAIN }}
        working-directory: ${{ steps.working-directory.outputs.working_directory }}
      - name: set entry path
        id: set-entry-path
        run: |
          files=($(git ls-files -o --exclude-standard))
          for file in ${files[@]}; do
            title=$(yq --front-matter=extract '.Title' "$file")
            if [[ "$title" == "$ENTRY_TITLE" ]]; then
              entry_path="$file"
            fi
          done
          if [[ -z "$entry_path" ]]; then
            echo "Error: No draft entry titled ${ENTRY_TITLE} was found"
            exit 1
          fi
          echo "ENTRY_PATH=$entry_path" >> $GITHUB_OUTPUT
        working-directory: ${{ steps.working-directory.outputs.working_directory }}
      - name: pull draft by title
        uses: hatena/hatenablog-workflows/.github/actions/create-draft-pull-request@4733a78ce725116ca961a11a79ab58ccc24a1b1c 
        with:
          title: ${{ inputs.title }}
          draft: ${{ inputs.draft }}
          BLOG_DOMAIN: ${{ steps.set-domain.outputs.BLOG_DOMAIN }}
          ENTRY_PATH: ${{ steps.set-entry-path.outputs.ENTRY_PATH }}
          working_directory: ${{ steps.working-directory.outputs.working_directory }}
