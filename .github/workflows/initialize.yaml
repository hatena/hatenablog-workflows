name: "[Reusable workflows] initialize"

on:
  workflow_call:
    inputs:
      is_draft_included:
        default: true
        type: boolean
      BLOG_DOMAIN:
        required: true
        type: string
      runner:
        required: false
        default: ubuntu-latest
        type: string
    secrets:
      OWNER_API_KEY:
        required: true

jobs:
  initialize:
    env:
      BLOGSYNC_PASSWORD: ${{ secrets.OWNER_API_KEY }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: resolve working directory
        id: working-directory
        uses: hatena/hatenablog-workflows/.github/actions/resolve-working-directory@cb4a9e94aa1400beceb5d9a99c772322b7fd6fc8
      - name: setup
        uses: hatena/hatenablog-workflows/.github/actions/setup@cb4a9e94aa1400beceb5d9a99c772322b7fd6fc8 
      - name: set blog domain
        id: set-domain
        run: |
          domain=${{ inputs.BLOG_DOMAIN }}
          echo "BLOG_DOMAIN=$(echo $domain | tr -d '\n\r ')" >> "$GITHUB_OUTPUT"
      - name: pull
        run: |
          blogsync pull ${{ steps.set-domain.outputs.BLOG_DOMAIN }}
        working-directory: ${{ steps.working-directory.outputs.working_directory }}
      - name: move draft and update metadata
        if: inputs.is_draft_included == true
        uses: hatena/hatenablog-workflows/.github/actions/move-draft-and-update-metadata@cb4a9e94aa1400beceb5d9a99c772322b7fd6fc8 
        with:
          working_directory: ${{ steps.working-directory.outputs.working_directory }}
      - name: delete draft files
        if: inputs.is_draft_included == false
        run: |
          target=$(git ls-files -mo --exclude-standard | xargs grep -xl 'Draft: true' || echo "")
          if [[ -n "$target" ]]; then
            IFS=" " read -r -a draft_files <<< "$(echo "$target" | xargs)"
            for file in "${draft_files[@]}"; do
              rm "$file"
            done
          fi
        working-directory: ${{ steps.working-directory.outputs.working_directory }}
      - name: create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: initialize
          branch: initialize
          commit-message: |
            initialize
          body: |
            はてなブログから取得した記事データを commit しました
            **${{ inputs.is_draft_included && '下書き記事を含んでいますので公開リポジトリの場合はマージは慎重に行ってください' || '公開記事のみが対象となっています'}}**
          labels: |
            skip-push
          delete-branch: true
