name: "[Reusable workflows] initialize"

on:
  workflow_call:
    inputs:
      is_draft_included:
        default: true
        type: boolean
      BLOG_DOMAIN:
        required: true
        type: string
      runner:
        required: false
        default: ubuntu-latest
        type: string
    secrets:
      OWNER_API_KEY:
        required: true

jobs:
  initialize:
    env:
      BLOGSYNC_PASSWORD: ${{ secrets.OWNER_API_KEY }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: resolve working directory
        id: working-directory
        uses: hatena/hatenablog-workflows/.github/actions/resolve-working-directory@6196f4d4ede7023b7810f5d55bc52b6de6a0ab67
      - name: setup
        uses: hatena/hatenablog-workflows/.github/actions/setup@6196f4d4ede7023b7810f5d55bc52b6de6a0ab67 
      - name: set blog domain
        id: set-domain
        run: |
          domain=${{ inputs.BLOG_DOMAIN }}
          echo "BLOG_DOMAIN=$(echo $domain | tr -d '\n\r ')" >> "$GITHUB_OUTPUT"
      - name: pull
        run: |
          blogsync pull ${{ steps.set-domain.outputs.BLOG_DOMAIN }}
        working-directory: ${{ steps.working-directory.outputs.working_directory }}
      - name: move draft and update metadata
        if: inputs.is_draft_included == true
        uses: hatena/hatenablog-workflows/.github/actions/move-draft-and-update-metadata@6196f4d4ede7023b7810f5d55bc52b6de6a0ab67 
        with:
          working_directory: ${{ steps.working-directory.outputs.working_directory }}
      - name: delete draft files
        if: inputs.is_draft_included == false
        run: |
          git ls-files -zmo --exclude-standard -- '*.md' | while IFS= read -r -d '' f; do
            if [[ -f "$f" ]] && [[ -n "$(yq --front-matter=extract 'select(.Draft == true)' "$f" 2>/dev/null)" ]]; then
              rm "$f"
            fi
          done
        working-directory: ${{ steps.working-directory.outputs.working_directory }}
      - name: create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          title: initialize
          branch: initialize
          commit-message: |
            initialize
          body: |
            はてなブログから取得した記事データを commit しました
            **${{ inputs.is_draft_included && '下書き記事を含んでいますので公開リポジトリの場合はマージは慎重に行ってください' || '公開記事のみが対象となっています'}}**
          labels: |
            skip-push
          delete-branch: true
          sign-commits: ${{ vars.HATENABLOG_WORKFLOWS_SIGN_COMMITS == 'true' }}
