name: "[Reusable workflows] upload images"

on:
  workflow_call:
    inputs:
      runner:
        required: false
        default: ubuntu-latest
        type: string
    secrets:
      OWNER_API_KEY:
        required: true
    outputs:
      revision:
        value: ${{ jobs.upload-image.outputs.revision }}

jobs:
  upload-image:
    runs-on: ${{ inputs.runner }}
    outputs:
      revision: ${{ steps.commit-and-push.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: resolve working directory
        id: working-directory
        uses: hatena/hatenablog-workflows/.github/actions/resolve-working-directory@d96c1ea3914d647ff9caade1881163be9d58b915
      - name: list changed entries
        id: changed-entries
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            **.md
          path: ${{ steps.working-directory.outputs.working_directory }}
      - name: set owner
        id: set-owner
        run: |
          owner=$(yq "..|.owner|select(.)" blogsync.yaml)
          if [[ -z "$owner" ]]; then
            owner=$(yq "..|.username|select(.)" blogsync.yaml)
          fi
          echo "OWNER_ID=$owner" >> $GITHUB_OUTPUT
        working-directory: ${{ steps.working-directory.outputs.working_directory }}
      - name: Download the script
        run: |
          curl -fsSL -o /tmp/fotolife-client.py https://raw.githubusercontent.com/hatena/hatenablog-workflows/v1/fotolife-client.py
          chmod +x /tmp/fotolife-client.py
      - name: List all changed files markdown files
        if: steps.changed-entries.outputs.any_changed == 'true'
        run: |
          for f in ${{ steps.changed-entries.outputs.all_changed_files }}; do
            python3 /tmp/fotolife-client.py "$f"
          done
        working-directory: ${{ steps.working-directory.outputs.working_directory }}
        env:
          HATENA_ID: ${{ steps.set-owner.outputs.OWNER_ID }}
          OWNER_API_KEY: ${{ secrets.OWNER_API_KEY }}
      - name: commit & push
        id: commit-and-push
        run: |
          git config user.name "actions-user"
          git config user.email "action@github.com"
          if [[ $(git diff) -eq 0 ]]; then
            exit 0
          fi

          git add .
          if [[ "$SIGN_COMMITS" == "true" ]]; then
            if git diff --cached --quiet; then
              exit 0
            fi
            # GitHub API 経由で commit すると、GitHub によって署名された commit になる
            set -o pipefail
            cd "$(git rev-parse --show-toplevel)"
            revision=$(git diff --cached --name-only -z \
              | xargs -0 -I{} jq -n --arg path {} --rawfile contents {} '{path: $path, contents: ($contents | @base64)}' \
              | jq -s \
                --arg repository "$GITHUB_REPOSITORY" \
                --arg branch "$BRANCH" \
                --arg head "$(git rev-parse HEAD)" \
                '{
                  query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
                  variables: {
                    input: {
                      branch: {repositoryNameWithOwner: $repository, branchName: $branch},
                      expectedHeadOid: $head,
                      message: {headline: "upload images to fotolife"},
                      fileChanges: {additions: .}
                    }
                  }
                }' \
              | gh api graphql --input - --jq '.data.createCommitOnBranch.commit.oid')
          else
            git commit -m "upload images to fotolife"
            git push
            revision=$(git rev-parse HEAD)
          fi

          echo "REVISION=$revision" >> $GITHUB_OUTPUT
        working-directory: ${{ steps.working-directory.outputs.working_directory }}
        env:
          SIGN_COMMITS: ${{ vars.HATENABLOG_WORKFLOWS_SIGN_COMMITS == 'true' }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
