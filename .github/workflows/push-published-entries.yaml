name: "[Reusable workflows] push published entries"

on:
  workflow_call:
    inputs:
      runner:
        required: false
        default: ubuntu-latest
        type: string
    secrets:
      OWNER_API_KEY:
        required: true

jobs:
  upload-images:
    if: github.event.pull_request.merged == false
    uses: hatena/hatenablog-workflows/.github/workflows/upload-images.yaml@d96c1ea3914d647ff9caade1881163be9d58b915
    with:
      runner: ${{ inputs.runner }}
    secrets:
      OWNER_API_KEY: ${{ secrets.OWNER_API_KEY }}
