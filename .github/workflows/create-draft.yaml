name: "[Reusable workflows] create draft and pull from hatenablog"

on:
  workflow_call:
    inputs:
      title:
        required: true
        type: string
      draft:
        default: true
        type: boolean
      BLOG_DOMAIN:
        required: true
        type: string
      runner:
        required: false
        default: ubuntu-latest
        type: string
    secrets:
      OWNER_API_KEY:
        required: true

jobs:
  post_draft_and_pull_from_hatenablog:
    name: create draft and pull from hatenablog
    runs-on: ${{ inputs.runner }}
    env:
      BLOGSYNC_PASSWORD: ${{ secrets.OWNER_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: resolve working directory
        id: working-directory
        uses: hatena/hatenablog-workflows/.github/actions/resolve-working-directory@4733a78ce725116ca961a11a79ab58ccc24a1b1c
      - name: setup
        uses: hatena/hatenablog-workflows/.github/actions/setup@4733a78ce725116ca961a11a79ab58ccc24a1b1c 
      - name: setup draft
        run: |
          yq --front-matter="process" ".Title=strenv(TITLE)" draft.template > draft
        working-directory: ${{ steps.working-directory.outputs.working_directory }}
        env:
          TITLE: ${{ inputs.title }}
      - name: set blog domain
        id: set-domain
        run: |
          domain=${{ inputs.BLOG_DOMAIN }}
          echo "BLOG_DOMAIN=$(echo $domain | tr -d '\n\r ')" >> "$GITHUB_OUTPUT"
      - name: post draft to hatenablog
        id: post-draft
        run: |
          entry_path=$(blogsync post --draft ${{ steps.set-domain.outputs.BLOG_DOMAIN }} < 'draft')
          echo "ENTRY_PATH=$entry_path" >> "$GITHUB_OUTPUT"
        working-directory: ${{ steps.working-directory.outputs.working_directory }}
      - name: fetch entry
        run: |
          blogsync fetch ${{ steps.post-draft.outputs.ENTRY_PATH }}
        working-directory: ${{ steps.working-directory.outputs.working_directory }}
      - name: pull draft by title
        uses: hatena/hatenablog-workflows/.github/actions/create-draft-pull-request@4733a78ce725116ca961a11a79ab58ccc24a1b1c 
        with:
          title: ${{ inputs.title }}
          draft: ${{ inputs.draft }}
          BLOG_DOMAIN: ${{ steps.set-domain.outputs.BLOG_DOMAIN }}
          ENTRY_PATH: ${{ steps.post-draft.outputs.ENTRY_PATH }}
          working_directory: ${{ steps.working-directory.outputs.working_directory }}
