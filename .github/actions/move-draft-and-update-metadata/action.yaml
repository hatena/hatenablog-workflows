name: move draft and update metadata

inputs:
  working_directory:
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: move draft and update metadata
      run: |
        git ls-files -zmo --exclude-standard -- '*.md' | while IFS= read -r -d '' file; do
          if [[ -f "$file" ]] && [[ -n "$(yq --front-matter=extract 'select(.Draft == true)' "$file" 2>/dev/null)" ]]; then
            entry_id=$(yq --front-matter=extract '.EditURL' "$file" | grep -oP '[^/]+\d$')
            yq --front-matter=process -i 'del(.Date,.URL)' "$file"
            mv "$file" "draft_entries/$entry_id.${file##*.}"
          fi
        done
      working-directory: ${{ inputs.working_directory }}
      shell: bash
